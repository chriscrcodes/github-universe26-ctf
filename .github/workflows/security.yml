name: Security verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CodeQL runs in its own job on purpose. The verification job below fails by
  # design while the vulnerability is still present, and a CodeQL step sharing
  # that job would report the failed job back to GitHub as a code scanning
  # configuration error.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.28.17
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3.28.17
        with:
          category: /language:javascript-typescript

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: codeql
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run behavior tests
        run: npm test

      - name: Start the application from the pushed commit
        run: |
          node app/src/server.js &
          PID=$!
          echo "$PID" > "$GITHUB_WORKSPACE/.app.pid"
          cleanup_startup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" || true
            rm -f "$GITHUB_WORKSPACE/.app.pid"
          }
          trap cleanup_startup EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "application is healthy"
              trap - EXIT
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "application exited before becoming healthy" >&2
              exit 1
            fi
            sleep 1
          done
          echo "application did not become healthy in time" >&2
          exit 1

      - name: Verify the remediation behavior
        run: node scripts/verify.mjs

      - name: Stop the application
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/.app.pid" ]; then
            PID="$(cat "$GITHUB_WORKSPACE/.app.pid")"
            kill "$PID" 2>/dev/null || true
            wait "$PID" || true
            rm -f "$GITHUB_WORKSPACE/.app.pid"
          fi

      - name: Confirm the SQL injection alert is closed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            alerts="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
              -f ref="${GITHUB_REF}" \
              -f state=open \
              --jq '[.[] | select(.rule.id == "js/sql-injection")] | length')"
            if [ "$alerts" = "0" ]; then
              exit 0
            fi
            echo "CodeQL still reports ${alerts} open SQL injection alert(s); waiting for ingestion..."
            sleep 10
          done
          echo "The SQL injection alert is still open for ${GITHUB_SHA}." >&2
          exit 1

      - name: Publish CodeQL-clean completion
        if: github.ref == 'refs/heads/main' && vars.BOARD_URL != ''
        env:
          BOARD_URL: ${{ vars.BOARD_URL }}
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BOARD_SESSION_ID: ${{ vars.BOARD_SESSION_ID }}
        run: |
          if [ -z "$BOARD_TOKEN" ]; then
            echo "BOARD_TOKEN is not configured; skipping the optional scoreboard update."
            exit 0
          fi
          payload="$(node -e 'const day = new Date().toISOString().slice(0, 10).replace(/-/g, "");
          process.stdout.write(JSON.stringify({
            sessionId: process.env.BOARD_SESSION_ID || day,
            teamId: (process.env.GITHUB_ACTOR || "").toLowerCase(),
            phase: "ci-clean",
            source: "ci",
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA
          }))')"
          curl --fail-with-body --retry 3 \
            -X POST "${BOARD_URL%/}/api/events" \
            -H "content-type: application/json" \
            -H "x-board-reporter-token: ${BOARD_TOKEN}" \
            --data "$payload"
