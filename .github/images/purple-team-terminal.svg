<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Purple Team Squad terminal</title>
  <desc id="description">A Copilot CLI terminal where Squad coordinates Red, Green, and Blue agents while the participant retains approval.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f85149" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#a371f7" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity=".22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#010409" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#0d1117"/>
  <circle cx="105" cy="94" r="170" fill="#f85149" opacity=".08"/>
  <circle cx="1090" cy="570" r="220" fill="#3fb950" opacity=".07"/>
  <rect x="48" y="42" width="1104" height="591" rx="24" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="64" y="58" width="1072" height="559" rx="18" fill="#0d1117" stroke="url(#frame)" stroke-width="2"/>
    <path d="M64 76a18 18 0 0 1 18-18h1036a18 18 0 0 1 18 18v54H64z" fill="#161b22"/>
    <line x1="64" y1="130" x2="1136" y2="130" stroke="#30363d" stroke-width="2"/>

    <circle cx="99" cy="94" r="9" fill="#f85149"/>
    <circle cx="128" cy="94" r="9" fill="#d29922"/>
    <circle cx="157" cy="94" r="9" fill="#3fb950"/>
    <text x="190" y="101" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">GitHub Copilot CLI · Squad</text>

    <text x="100" y="176" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="1.4">YOU</text>
    <text x="100" y="212" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">Investigate the hotel search. Prove the issue, compare fixes,</text>
    <text x="100" y="244" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">and wait for my approval before changing code.</text>

    <line x1="100" y1="278" x2="1100" y2="278" stroke="#30363d" stroke-width="2"/>
    <text x="100" y="318" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="1.4">SQUAD ROUTING</text>

    <g transform="translate(100 344)">
      <rect width="1000" height="54" rx="10" fill="#161b22"/>
      <rect width="7" height="54" rx="3.5" fill="#f85149"/>
      <circle cx="39" cy="27" r="13" fill="#f85149" opacity=".18"/>
      <text x="34" y="34" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">R</text>
      <text x="70" y="34" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">RED</text>
      <text x="150" y="34" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">reproducing the supplied read-only exploit</text>
    </g>

    <g transform="translate(100 410)">
      <rect width="1000" height="54" rx="10" fill="#161b22"/>
      <rect width="7" height="54" rx="3.5" fill="#3fb950"/>
      <circle cx="39" cy="27" r="13" fill="#3fb950" opacity=".18"/>
      <text x="34" y="34" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">G</text>
      <text x="70" y="34" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">GREEN</text>
      <text x="172" y="34" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">tracing CodeQL flow and comparing remediations</text>
    </g>

    <g transform="translate(100 476)">
      <rect width="1000" height="54" rx="10" fill="#161b22"/>
      <rect width="7" height="54" rx="3.5" fill="#58a6ff"/>
      <circle cx="39" cy="27" r="13" fill="#58a6ff" opacity=".18"/>
      <text x="34" y="34" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">B</text>
      <text x="70" y="34" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">BLUE</text>
      <text x="161" y="34" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">designing regressions and protecting normal behavior</text>
    </g>

    <line x1="100" y1="554" x2="1100" y2="554" stroke="#30363d" stroke-width="2"/>
    <circle cx="111" cy="584" r="6" fill="#a371f7"/>
    <text x="130" y="591" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">3 specialists investigating · participant approval required</text>
    <rect x="897" y="568" width="203" height="34" rx="17" fill="#238636"/>
    <text x="925" y="591" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">HUMAN IN CONTROL</text>
  </g>
</svg>
